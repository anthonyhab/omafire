name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: Static checks and fresh-profile smoke test
    steps:
      - name: Check out this branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install validation dependencies
        run: |
          sudo add-apt-repository ppa:mozillateam/ppa
          printf '%s\n' \
            'Package: *' \
            'Pin: release o=LP-PPA-mozillateam' \
            'Pin-Priority: 1001' \
            | sudo tee /etc/apt/preferences.d/mozilla-firefox
          sudo apt-get update
          sudo apt-get install --yes firefox shellcheck

      - name: Run branch-local static checks
        run: ./scripts/check-omarchy.sh

      - name: Install this checkout into a fresh profile
        env:
          FIREFOX_HOME: ${{ runner.temp }}/firefox
        run: |
          mkdir -p "$FIREFOX_HOME/test.default"
          cat > "$FIREFOX_HOME/profiles.ini" <<'EOF'
          [Profile0]
          Name=test
          IsRelative=1
          Path=test.default
          Default=1
          EOF
          ./scripts/install.sh -f "$FIREFOX_HOME" -p test.default
          test -f "$FIREFOX_HOME/test.default/chrome/firefox-gnome-theme/omarchy-chrome.css"
          grep -Fq 'firefox-gnome-theme/userChrome.css' \
            "$FIREFOX_HOME/test.default/chrome/userChrome.css"

      - name: Start Firefox from the fresh profile
        env:
          PROFILE: ${{ runner.temp }}/firefox/test.default
          SCREENSHOT: ${{ runner.temp }}/firefox-smoke.png
        run: |
          timeout 45s firefox --headless --no-remote --profile "$PROFILE" \
            --screenshot "$SCREENSHOT" about:blank
          test -s "$SCREENSHOT"
