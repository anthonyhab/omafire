name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: Static checks and fresh-profile smoke test
    steps:
      - name: Check out this branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install validation dependencies
        run: |
          sudo add-apt-repository ppa:mozillateam/ppa
          printf '%s\n' \
            'Package: *' \
            'Pin: release o=LP-PPA-mozillateam' \
            'Pin-Priority: 1001' \
            | sudo tee /etc/apt/preferences.d/mozilla-firefox
          sudo apt-get update
          sudo apt-get install --yes firefox shellcheck

      - name: Run branch-local static checks
        run: ./scripts/check-omarchy.sh

      - name: Wire a fresh profile the same way a packaged install is documented
        env:
          FIREFOX_HOME: ${{ runner.temp }}/firefox
          THEME_DIR: ${{ runner.temp }}/theme-install
        run: |
          mkdir -p "$FIREFOX_HOME/test.default/chrome" "$THEME_DIR"
          cat > "$FIREFOX_HOME/profiles.ini" <<'EOF'
          [Profile0]
          Name=test
          IsRelative=1
          Path=test.default
          Default=1
          EOF

          # Stand in for a static package payload staged outside the checkout
          # (e.g. an AUR package's /usr/share/<pkgname>), then wire it in
          # exactly as README.md documents: symlink it into the profile's
          # chrome directory and add the two @import lines by hand.
          git ls-files -z | xargs -0 cp --parents -t "$THEME_DIR"
          ln -s "$THEME_DIR" "$FIREFOX_HOME/test.default/chrome/omarchy-chrome"
          printf '%s\n' '@import "omarchy-chrome/userChrome.css";' \
            > "$FIREFOX_HOME/test.default/chrome/userChrome.css"
          printf '%s\n' '@import "omarchy-chrome/userContent.css";' \
            > "$FIREFOX_HOME/test.default/chrome/userContent.css"
          grep 'user_pref' "$THEME_DIR/configuration/user.js" \
            > "$FIREFOX_HOME/test.default/user.js"

          test -f "$FIREFOX_HOME/test.default/chrome/omarchy-chrome/omarchy-chrome.css"
          grep -Fq 'omarchy-chrome/userChrome.css' \
            "$FIREFOX_HOME/test.default/chrome/userChrome.css"

      - name: Start Firefox from the fresh profile
        env:
          PROFILE: ${{ runner.temp }}/firefox/test.default
          SCREENSHOT: ${{ runner.temp }}/firefox-smoke.png
        run: |
          timeout 45s firefox --headless --no-remote --profile "$PROFILE" \
            --screenshot "$SCREENSHOT" about:blank
          test -s "$SCREENSHOT"
