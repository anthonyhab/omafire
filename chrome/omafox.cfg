// Omafox chrome script loader. (Firefox skips this file's first line.)
//
// Installed by the omarchy-firefox package to /usr/lib/firefox/omafox.cfg,
// with its scripts in /usr/lib/firefox/omafox/. It loads a fixed list of
// those root-owned scripts into each browser window of a profile omafox
// manages (user_pref "omarchy.omafox", written by `omafox setup`); other
// profiles see nothing. A profile can switch them all off (omarchy.scripts)
// or some (omarchy.scripts.disabled, a list of names) but can never supply
// one: nothing is read from the profile.
(function () {
  const SCRIPTS = ["extension", "settings", "keys", "live-palette"];

  const Cc = Components.classes;
  const Ci = Components.interfaces;
  const dirs = Cc["@mozilla.org/file/directory_service;1"]
    .getService(Ci.nsIProperties);
  const scriptDir = dirs.get("GreD", Ci.nsIFile);
  scriptDir.append("omafox");
  if (!scriptDir.exists() || !scriptDir.isDirectory()) {
    return;
  }

  // loadSubScript refuses file: URLs; the directory is served as
  // resource://omafox/ instead.
  const io = Cc["@mozilla.org/network/io-service;1"].getService(Ci.nsIIOService);
  const resource = io.getProtocolHandler("resource")
    .QueryInterface(Ci.nsIResProtocolHandler);
  if (!resource.hasSubstitution("omafox")) {
    resource.setSubstitution("omafox", io.newFileURI(scriptDir));
  }

  const prefs = Cc["@mozilla.org/preferences-service;1"]
    .getService(Ci.nsIPrefBranch);
  const loader = Cc["@mozilla.org/moz/jssubscript-loader;1"]
    .getService(Ci.mozIJSSubScriptLoader);
  const console = Cc["@mozilla.org/consoleservice;1"]
    .getService(Ci.nsIConsoleService);

  Cc["@mozilla.org/observer-service;1"].getService(Ci.nsIObserverService)
    .addObserver({
      observe(win) {
        // This file runs before the profile's prefs are read; by the time a
        // window has started they are, so the opt-in is checked here.
        if (!prefs.getBoolPref("omarchy.omafox", false)
            || !prefs.getBoolPref("omarchy.scripts", true)
            || win.location.href !== "chrome://browser/content/browser.xhtml") {
          return;
        }
        const off = prefs.getStringPref("omarchy.scripts.disabled", "")
          .split(/[\s,]+/);
        for (const name of SCRIPTS) {
          if (off.includes(name)) {
            continue;
          }
          try {
            loader.loadSubScript(`resource://omafox/${name}.uc.js`, win, "UTF-8");
          } catch (error) {
            console.logStringMessage(`[omafox:${name}] ${error}`);
          }
        }
      },
    }, "browser-delayed-startup-finished");
})();
