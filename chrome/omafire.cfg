// Omafire chrome script loader. (Firefox skips this file's first line.)
//
// Installed by the omafire package to /usr/lib/firefox/omafire.cfg,
// with its scripts in /usr/lib/firefox/omafire/. It loads a fixed list of
// those root-owned scripts into each browser window of a profile omafire
// manages (user_pref "omafire.managed", written by `omafire setup`); other
// profiles see nothing. A profile can switch them all off (omafire.scripts)
// or some (omafire.scripts.disabled, a list of names) but can never supply
// one: nothing is read from the profile. "config" in that list stops
// config.sys.mjs, which keeps prefs equal to ~/.config/omafire/config.json.
(function () {
  const SCRIPTS = ["extension", "settings", "keys", "live-palette", "compact", "tab-numbers", "site-colors"];

  const Cc = Components.classes;
  const Ci = Components.interfaces;
  const dirs = Cc["@mozilla.org/file/directory_service;1"]
    .getService(Ci.nsIProperties);
  const scriptDir = dirs.get("GreD", Ci.nsIFile);
  scriptDir.append("omafire");
  if (!scriptDir.exists() || !scriptDir.isDirectory()) {
    return;
  }

  // loadSubScript refuses file: URLs; the directory is served as
  // resource://omafire/ instead.
  const io = Cc["@mozilla.org/network/io-service;1"].getService(Ci.nsIIOService);
  const resource = io.getProtocolHandler("resource")
    .QueryInterface(Ci.nsIResProtocolHandler);
  if (!resource.hasSubstitution("omafire")) {
    resource.setSubstitution("omafire", io.newFileURI(scriptDir));
  }

  const prefs = Cc["@mozilla.org/preferences-service;1"]
    .getService(Ci.nsIPrefBranch);
  const loader = Cc["@mozilla.org/moz/jssubscript-loader;1"]
    .getService(Ci.mozIJSSubScriptLoader);
  const console = Cc["@mozilla.org/consoleservice;1"]
    .getService(Ci.nsIConsoleService);

  const managed = () => prefs.getBoolPref("omafire.managed", false);
  const enabled = name => prefs.getBoolPref("omafire.scripts", true)
    && !prefs.getStringPref("omafire.scripts.disabled", "").split(/[\s,]+/).includes(name);

  const observers = Cc["@mozilla.org/observer-service;1"]
    .getService(Ci.nsIObserverService);

  // Settings (config.json) before the first window shows, so its first
  // frame has them; the module then follows the file for the session.
  observers.addObserver({
    observe() {
      observers.removeObserver(this, "final-ui-startup");
      if (!managed()) {
        return;
      }
      if (!enabled("config")) {
        return;
      }
      try {
        ChromeUtils.importESModule("resource://omafire/config.sys.mjs").OmafireConfig.start();
      } catch (error) {
        console.logStringMessage(`[omafire:config] ${error}`);
      }
      if (enabled("pseudo-state")) {
        try {
          ChromeUtils.registerWindowActor("OmafirePseudo", {
            parent: { esModuleURI: "resource://omafire/pseudo-state.sys.mjs" },
            child: {
              esModuleURI: "resource://omafire/pseudo-state.sys.mjs",
              events: { "omafire:pseudo": { wantUntrusted: true, capture: true } },
            },
            allFrames: true,
            matches: ["http://*/*", "https://*/*"],
            // without this a web content process never loads the actor
            safeForUntrustedWebProcess: true,
          });
        } catch (error) {
          console.logStringMessage(`[omafire:pseudo-state] ${error}`);
        }
      }
    },
  }, "final-ui-startup");

  observers
    .addObserver({
      observe(win) {
        // This file runs before the profile's prefs are read; by the time a
        // window has started they are, so the opt-in is checked here.
        if (!managed()) {
          return;
        }
        if (win.location.href !== "chrome://browser/content/browser.xhtml") {
          return;
        }
        for (const name of SCRIPTS) {
          if (!enabled(name)) {
            continue;
          }
          try {
            loader.loadSubScript(`resource://omafire/${name}.uc.js`, win, "UTF-8");
          } catch (error) {
            console.logStringMessage(`[omafire:${name}] ${error}`);
          }
        }
      },
    }, "browser-delayed-startup-finished");
})();
