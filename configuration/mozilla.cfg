// Firefox GNOME theme: load the opt-in profile chrome script after browser startup.
(function () {
    var Cc = Components.classes;
    var Ci = Components.interfaces;
    var scriptLoader = Cc["@mozilla.org/moz/jssubscript-loader;1"].getService(
        Ci.mozIJSSubScriptLoader,
    );
    var profile = Cc["@mozilla.org/file/directory_service;1"]
        .getService(Ci.nsIProperties)
        .get("ProfD", Ci.nsIFile);
    var script = profile.clone();
    script.append("chrome");
    script.append("favicon-contrast.uc.js");

    if (!script.exists() || !script.isFile()) {
        return;
    }

    var scriptURL = Cc["@mozilla.org/network/io-service;1"]
        .getService(Ci.nsIIOService)
        .newFileURI(script)
        .spec;

    var Cu = Components.utils;
    var observerService = Cc["@mozilla.org/observer-service;1"].getService(
        Ci.nsIObserverService,
    );
    var startupObserver = {
        observe: function (subject, topic) {
            if (topic !== "browser-delayed-startup-finished") {
                return;
            }

            try {
                scriptLoader.loadSubScript(scriptURL, subject, "UTF-8");
            } catch (error) {
                Cu.reportError("[favicon-contrast] " + error);
            }
        },
    };

    observerService.addObserver(
        startupObserver,
        "browser-delayed-startup-finished",
    );
})();
