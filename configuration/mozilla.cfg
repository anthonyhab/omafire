// Omarchy Firefox: opt-in loader for application-owned helpers.
(function () {
    var Cc = Components.classes;
    var Ci = Components.interfaces;
    var Cu = Components.utils;
    var directoryService = Cc["@mozilla.org/file/directory_service;1"].getService(
        Ci.nsIProperties,
    );

    // A profile opts in per helper; profile-writable content is never executed.
    var helpers = [
        [".omarchy-favicon-contrast-enabled", "favicon-contrast.uc.js"],
        [".omarchy-features-enabled", "omarchy-features.uc.js"],
    ];
    var enabled = helpers.filter(function (helper) {
        var marker = directoryService.get("ProfD", Ci.nsIFile);
        marker.append("chrome");
        marker.append(helper[0]);
        return marker.exists() && marker.isFile();
    });
    if (enabled.length === 0) {
        return;
    }

    var scriptDirectory = directoryService.get("GreD", Ci.nsIFile);
    scriptDirectory.append("omarchy");

    var scriptLoader = Cc["@mozilla.org/moz/jssubscript-loader;1"].getService(
        Ci.mozIJSSubScriptLoader,
    );
    var observerService = Cc["@mozilla.org/observer-service;1"].getService(
        Ci.nsIObserverService,
    );
    var ioService = Cc["@mozilla.org/network/io-service;1"].getService(
        Ci.nsIIOService,
    );

    // loadSubScript refuses file:// URIs, so the helper directory is exposed
    // through a resource:// substitution instead.
    var resourceHandler = ioService
        .getProtocolHandler("resource")
        .QueryInterface(Ci.nsIResProtocolHandler);
    if (!resourceHandler.hasSubstitution("omarchy")) {
        resourceHandler.setSubstitution(
            "omarchy",
            ioService.newFileURI(scriptDirectory),
        );
    }

    var startupObserver = {
        observe: function (subject, topic) {
            if (topic !== "browser-delayed-startup-finished") {
                return;
            }

            enabled.forEach(function (helper) {
                var script = scriptDirectory.clone();
                script.append(helper[1]);
                if (!script.exists() || !script.isFile()) {
                    Cu.reportError(
                        "[omarchy] Application helper is missing: "
                            + script.path,
                    );
                    return;
                }
                try {
                    scriptLoader.loadSubScript(
                        "resource://omarchy/" + helper[1],
                        subject,
                        "UTF-8",
                    );
                } catch (error) {
                    Cu.reportError("[omarchy:" + helper[1] + "] " + error);
                }
            });
        },
    };

    observerService.addObserver(
        startupObserver,
        "browser-delayed-startup-finished",
    );
})();
